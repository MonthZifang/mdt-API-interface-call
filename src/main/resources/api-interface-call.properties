# API模块
API模块.启用=true
API模块.定义目录=definitions
API模块.默认超时毫秒=5000
API模块.失败重试次数=1
API模块.返回缓存秒数=30
API模块.日志详细模式=false

# 允许的方法
API模块.允许GET=true
API模块.允许POST=true
API模块.允许PUT=false
API模块.允许DELETE=false

# 默认请求头
默认请求头.User-Agent=MDT-API-Interface-Call
默认请求头.Accept=application/json

# 安全
安全.允许明文令牌=true
安全.令牌字段名=Authorization
